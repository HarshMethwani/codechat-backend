services:
  codechat:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API=${GEMINI_API}
    volumes:
      # Persist cloned repos and vector store
      - codechat_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  codechat_data:
